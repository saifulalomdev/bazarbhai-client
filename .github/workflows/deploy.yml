name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install PNPM first 👈 ADD THIS STEP
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Forces a stable version of pnpm

      # 2. Setup Node and let it cache pnpm dependencies
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # Now this will work seamlessly

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Replaces npm ci

      - name: Build Vite App
        run: pnpm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bb-client